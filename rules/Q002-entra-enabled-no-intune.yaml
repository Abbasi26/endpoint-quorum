id: Q002
title: Enabled Windows device in Entra with no Intune record
severity: medium
enabled: true
description: >
  The Entra device is enabled and is classified as a Windows client,
  but Intune has no managed-device record for it.
whyItMatters: >
  An enabled Entra device can still satisfy device-based Conditional Access
  even when endpoint management has no record of it.
remediation: >
  Decide whether the device should be enrolled. If it is retired or personal,
  disable or delete the Entra object so it cannot be trusted by mistake.
  Windows Server is a separate device class. Released Windows Server versions
  cannot enroll in Intune; only eligible Windows Server Insider preview
  builds can, in nonproduction environments.
condition:
  all:
    - fact: entra.present
      op: eq
      value: true
    - fact: entra.enabled
      op: eq
      value: true
    - fact: device.class
      op: eq
      value: windows
    - fact: intune.present
      op: eq
      value: false
