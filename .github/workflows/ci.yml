name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu pwsh 7.6 LTS
            os: ubuntu-latest
            shell: pwsh
            pwsh: '7.6.10'
            sha256-linux: e261cabc91c78a9afe8d1e5f24731ab0d38204735ab2ec94b0af55102652e10d
            sha256-windows: 7d871531806eb1646264e4bbabd9f0c30c23355591bc756bb9909448c29ae166
          - name: ubuntu pwsh 7.7
            os: ubuntu-latest
            shell: pwsh
            pwsh: '7.7.0'
            sha256-linux: c89d9c682d2c403dfe726f3df948e359675235a5bd6fab535776de69729ca0cb
            sha256-windows: 7c74e03b20a75b59715847439d046a6214b1863ee79b187872980f139bb4a05f
          - name: windows pwsh 7.6 LTS
            os: windows-latest
            shell: pwsh
            pwsh: '7.6.10'
            sha256-linux: e261cabc91c78a9afe8d1e5f24731ab0d38204735ab2ec94b0af55102652e10d
            sha256-windows: 7d871531806eb1646264e4bbabd9f0c30c23355591bc756bb9909448c29ae166
          - name: windows pwsh 7.7
            os: windows-latest
            shell: pwsh
            pwsh: '7.7.0'
            sha256-linux: c89d9c682d2c403dfe726f3df948e359675235a5bd6fab535776de69729ca0cb
            sha256-windows: 7c74e03b20a75b59715847439d046a6214b1863ee79b187872980f139bb4a05f
          - name: windows powershell 5.1
            os: windows-latest
            shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install PowerShell ${{ matrix.pwsh }}
        uses: ./.github/actions/install-pwsh
        if: matrix.shell == 'pwsh'
        with:
          version: ${{ matrix.pwsh }}
          sha256-linux: ${{ matrix.sha256-linux }}
          sha256-windows: ${{ matrix.sha256-windows }}

      - name: Install Pester 5
        run: |
          $ErrorActionPreference = 'Stop'
          $have = @(Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.9.1' })
          if ($have.Count -eq 0) {
            Install-Module Pester -RequiredVersion 5.9.1 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -RequiredVersion 5.9.1 -Force
          Write-Host ("Pester " + (Get-Module Pester).Version)

      - name: Run tests
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.9.1 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Lint shipped rules
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./Quorum.psd1 -Force
          $checks = @(Test-QuorumRule -Path ./rules)
          $checks | Format-Table Id, Valid, @{ n = 'Errors'; e = { $_.Errors -join '; ' } } -AutoSize | Out-String | Write-Host
          if (@($checks | Where-Object { -not $_.Valid }).Count -gt 0) { exit 1 }
